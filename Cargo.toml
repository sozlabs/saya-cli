[package]
name = "saya_cli"
version = "0.1.0"
edition = "2021"
description = "Thin CLI client for the soz-saya HTTP API"
license = "Apache-2.0"
repository = "https://github.com/sozlabs/saya-cli"
autobins = false

[[bin]]
name = "saya"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
directories = "5"
futures-util = "0.3"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
